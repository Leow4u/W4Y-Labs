#
# docker-compose.windows.yml — Windows Docker Desktop compatible
#
# Differences from docker-compose.yml:
#   - Removes `network_mode: host` (not supported on Docker Desktop for Windows)
#   - Uses explicit port mappings instead
#   - Uses Windows-style volume path for ~/.wayne
#
# Usage:
#   docker compose -f docker-compose.windows.yml up -d
#
# A shell inside the running container:
#   docker exec -it work4you bash
#
# WAYNE_UID/WAYNE_GID keep their names for now — the environment-variable
# rename ships in a later migration phase with its own dual-read bridge.
#
services:
  gateway:
    # Built locally from this repo (same as docker-compose.yml) — never the
    # upstream Docker Hub image, which ships different code.
    build: .
    image: work4you-agent
    container_name: work4you
    restart: unless-stopped
    volumes:
      - ${USERPROFILE}/.wayne:/opt/data
    environment:
      - WAYNE_UID=10000
      - WAYNE_GID=10000
    command: ["gateway", "run"]

  dashboard:
    image: work4you-agent
    container_name: work4you-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ${USERPROFILE}/.wayne:/opt/data
    environment:
      - WAYNE_UID=10000
      - WAYNE_GID=10000
      - WAYNE_DASHBOARD_HOST=0.0.0.0
    ports:
      - "127.0.0.1:9119:9119"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--insecure"]
