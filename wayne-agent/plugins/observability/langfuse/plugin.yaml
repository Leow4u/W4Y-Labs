name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Wayne — traces conversations, LLM calls, and tool usage. Opt-in via `wayne plugins enable observability/langfuse` or `wayne tools → Langfuse Observability`."
author: NousResearch
requires_env:
  - WAYNE_LANGFUSE_PUBLIC_KEY
  - WAYNE_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
