name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Work4You — traces conversations, LLM calls, and tool usage. Opt-in via `work4you plugins enable observability/langfuse` or `work4you tools → Langfuse Observability`."
author: NousResearch
requires_env:
  - WAYNE_LANGFUSE_PUBLIC_KEY
  - WAYNE_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
