<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work4You</title>
<style>
  /* Esta página é o PRIMEIRO frame do produto, não uma tela de serviço.
     Antes ela era um console escuro anunciando "Instalando o Python",
     "Baixando o motor" — o usuário abria o app e via a nossa engrenagem.
     Agora ela veste a mesma casca do produto (creme editorial + sidebar), de
     modo que quando o motor sobe e o loadURL troca a página, a transição não
     se percebe. O que é técnico continua existindo, mas dobrado dentro de
     "Detalhes técnicos" — visível quando algo dá errado, nunca antes. */
  :root {
    --bg: #faf9f5;
    --panel: #ffffff;
    --line: rgba(26, 25, 21, 0.14);
    --text: #1a1915;
    --muted: rgba(26, 25, 21, 0.62);
    --live: #c15f3c;
    --live-strong: #9d4a2d;
    --ok: #1f7a45;
    --err: #b3382c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    -webkit-user-select: none;
    user-select: none;
  }
  /* Silhueta da barra lateral: as MESMAS proporções do app, sem itens falsos
     em que dê vontade de clicar. É moldura, não isca. */
  .rail {
    width: 240px;
    flex: none;
    border-right: 1px solid var(--line);
    padding: 44px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .rail-row {
    height: 30px;
    border-radius: 8px;
    background: rgba(26, 25, 21, 0.045);
  }
  .rail-row.w70 { width: 70%; }
  .rail-row.w55 { width: 55%; }
  .rail-row.w60 { width: 60%; }
  .stage-area {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 44px 24px 24px;
  }
  @media (max-width: 720px) { .rail { display: none; } }
  /* Compact update window (420x220). The rail already hides itself at this
     width; this only tightens the card so logo + one line + spinner fit, and
     removes everything that is not those three things. */
  body.compact .stage-area { padding: 0 20px; }
  body.compact .card { width: 100%; gap: 14px; align-items: center; text-align: center; }
  body.compact .brand { height: 26px; }
  body.compact .status { justify-content: center; }
  body.compact #hint,
  body.compact #log-box,
  body.compact #notice,
  body.compact #gate { display: none !important; }
  /* Failure is the ONLY case that may offer technical detail, and only folded. */
  body.compact.failed #log-box { display: block !important; }
  body.compact.failed #log-box[open] { max-height: 120px; overflow: auto; }
  .card {
    width: min(560px, 100%);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  /* Frameless window (0.3.7): this page shares the BrowserWindow with the
     dashboard, so it must provide its own drag region at the top. Height
     matches the titleBarOverlay (36px); the native window controls the
     overlay paints sit on top of the strip's right edge. */
  #drag-strip {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 36px;
    -webkit-app-region: drag;
    z-index: 10;
  }
  /* Official wordmark (work4you-logo.png, embedded so the boot page stays a
     single offline file). The source art is dark-on-transparent; this page's
     palette is fixed dark, so a grayscale+invert filter renders it light and
     keeps it legible whatever the artwork's own hues (theme-safe). */
  .brand {
    height: 28px;
    width: auto;
    align-self: flex-start;
    -webkit-user-drag: none;
    /* Arte é escura sobre transparente e a página agora é clara: sem filtro. */
  }

  .status { display: flex; align-items: center; gap: 12px; min-height: 28px; }
  .spinner {
    width: 18px; height: 18px; flex: none;
    border: 2px solid var(--line);
    border-top-color: var(--live);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-text { font-size: 15px; }
  #hint { color: var(--muted); font-size: 12.5px; margin-top: -12px; }

  /* Estágios da instalação */
  #stages {
    list-style: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    padding: 6px 0;
    max-height: 240px;
    overflow-y: auto;
  }
  #stages li {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 14px;
    color: var(--muted);
    font-size: 13px;
  }
  #stages li .mark {
    width: 16px; text-align: center; flex: none;
    font-size: 12px;
  }
  #stages li.running { color: var(--text); }
  #stages li.running .mark {
    width: 12px; height: 12px; margin: 0 2px;
    border: 2px solid var(--line);
    border-top-color: var(--live);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  #stages li.succeeded .mark { color: var(--ok); }
  #stages li.skipped .mark { color: var(--muted); }
  #stages li.failed { color: var(--err); }
  #stages li.failed .mark { color: var(--err); }

  /* Gate de acesso: login primário + chave manual secundária */
  #gate {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .gate-title { font-size: 13.5px; }
  .gate-title small { color: var(--muted); display: block; margin-top: 2px; }
  #btn-login { align-self: flex-start; }
  #login-wait { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  #login-wait .spinner { width: 14px; height: 14px; border-width: 2px; }
  /* Discreet "não perguntar de novo" (composio-only gate). */
  #gate-snooze {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    margin-top: -6px;
  }
  #gate-snooze input { accent-color: var(--live); cursor: pointer; }
  #login-error { color: var(--err); font-size: 12.5px; }
  #manual-key summary {
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    list-style: none;
  }
  #manual-key summary::before { content: "▸ "; }
  #manual-key[open] summary::before { content: "▾ "; }
  #key-form {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Aviso persistente (ex.: plano sem créditos) */
  #notice {
    border: 1px solid rgba(217, 119, 87, 0.45);
    border-radius: 10px;
    background: rgba(217, 119, 87, 0.08);
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
  }
  #key-input {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font: 13px "Cascadia Mono", Consolas, monospace;
    padding: 9px 12px;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  #key-input:focus { border-color: var(--live); }
  #key-error { color: var(--err); font-size: 12.5px; display: none; }
  .actions { display: flex; gap: 10px; align-items: center; }
  button {
    font: 600 13px "Segoe UI", system-ui, sans-serif;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  button.primary { background: var(--live); color: #1b120d; }
  button.primary:hover { background: var(--live-strong); }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }
  button:disabled { opacity: 0.5; cursor: default; }

  /* Erro */
  #error-box {
    border: 1px solid rgba(208, 106, 90, 0.45);
    border-radius: 10px;
    background: rgba(208, 106, 90, 0.08);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #error-text { font-size: 13.5px; line-height: 1.55; }

  /* Log técnico colapsável */
  #log-box summary {
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    list-style: none;
  }
  #log-box summary::before { content: "▸ "; }
  #log-box[open] summary::before { content: "▾ "; }
  #log {
    margin-top: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    max-height: 180px;
    overflow: auto;
    font: 11.5px "Cascadia Mono", Consolas, monospace;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-all;
    -webkit-user-select: text;
    user-select: text;
  }
  [hidden] { display: none !important; }
</style>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const bridge = window.w4yBoot;
  if (!bridge) {
    $("status-text").textContent = "Ponte do aplicativo indisponível.";
    $("spinner").hidden = true;
    return;
  }

  // Nomes amigáveis dos estágios do install.ps1 (chave = Name do manifest;
  // desconhecido cai no Title em inglês vindo do próprio manifest).
  const STAGE_NAMES = {
    uv: "Preparando o gerenciador de pacotes",
    python: "Instalando o Python",
    git: "Instalando o Git",
    node: "Verificando o Node.js",
    "system-packages": "Instalando ferramentas do sistema",
    repository: "Baixando o motor Work4You",
    venv: "Criando o ambiente Python",
    dependencies: "Instalando as dependências",
    "node-deps": "Preparando a interface",
    desktop: "Montando o aplicativo",
    path: "Ajustando o sistema",
    "config-templates": "Escrevendo a configuração inicial",
    "platform-sdks": "Instalando integrações de mensagens",
    "bootstrap-marker": "Finalizando a instalação",
    configure: "Configuração guiada",
    gateway: "Gateway de mensagens",
  };

  // Linguagem de PRODUTO. As fases continuam existindo (o main manda as
  // mesmas), mas o usuário não precisa saber que existe um "motor local" nem
  // que ele está sendo "resolvido" — quem quiser o detalhe abre "Detalhes
  // técnicos". A única fase que ainda explica é a PRIMEIRA instalação, porque
  // ali a espera é longa e calar seria pior do que dizer.
  const PHASES = {
    // Cold import of the local engine can take ~30–40s on Windows — keep the
    // spinner + calm copy; the real error only arrives after the probe budget.
    resolve: {
      text: "Preparando o Work4You…",
      hint: "Na primeira abertura do dia pode levar um momento.",
    },
    bootstrap: {
      text: "Preparando o Work4You…",
      hint: "Só agora, uma vez. Pode deixar rodando — continua sozinho.",
    },
    update: {
      text: "Preparando o Work4You…",
      hint: "Atualizando. Pode deixar rodando — continua sozinho.",
    },
    key: { text: "Quase lá.", hint: "" },
    spawn: { text: "Abrindo…", hint: "" },
    ready: { text: "Abrindo…", hint: "" },
    cloud: { text: "Abrindo…", hint: "" },
    idle: { text: "Abrindo…", hint: "" },
  };

  const MARKS = { pending: "·", succeeded: "✓", skipped: "–", failed: "✕" };
  const stageEls = new Map(); // name -> li
  let logCount = 0;
  // Gate variant (0.3.4): the main sends { gate: { needModel, needComposio } }
  // with the "key" phase. Model key missing → the classic key gate (login +
  // manual key). Model present, only Composio missing → the login reads
  // "connect your apps" and "Agora não" skips (no manual key — there is no
  // key to paste for connectors). Remembered across the state() replay.
  let lastGate = null;

  function configureGate() {
    const composioOnly = Boolean(lastGate && !lastGate.needModel && lastGate.needComposio);
    $("gate-title-main").textContent = composioOnly
      ? "Conecte sua conta pra ativar os apps"
      : "Quase lá — conecte sua conta";
    $("gate-title-sub").textContent = composioOnly
      ? "Entre com o seu login Work4You e os aplicativos conectados chegam sozinhos."
      : "Entre com o seu login Work4You e a chave de acesso chega sozinha.";
    $("btn-gate-later").hidden = !composioOnly;
    // "não perguntar de novo" rides ONLY the composio-only variant — the main
    // ignores the flag anyway when the model key is missing (defense in depth).
    $("gate-snooze").hidden = !composioOnly;
    $("manual-key").hidden = composioOnly;
  }

  function setStatus(phase, message) {
    const meta = PHASES[phase] || PHASES.idle;
    $("status-text").textContent =
      phase === "error" ? "Não deu pra subir o motor local." : message || meta.text;
    const hint = meta.hint || "";
    $("hint").textContent = hint;
    $("hint").hidden = !hint;
    $("spinner").hidden = phase === "error" || phase === "key";
    $("gate").hidden = phase !== "key";
    if (phase === "key") configureGate();
    if (phase !== "key") setLoginWaiting(false); // saiu do gate → limpa o estado de espera
    $("error-box").hidden = phase !== "error";
    if (phase === "error") {
      $("error-text").textContent = message || "Algo deu errado ao preparar o motor local.";
      $("stages").hidden = stageEls.size === 0;
    }
    if (phase === "key") setTimeout(() => $("btn-login").focus(), 0);
  }

  // Estado de espera do login: botão some, linha "esperando…" aparece e o
  // caminho manual se recolhe (volta tudo quando o fluxo termina/cancela).
  function setLoginWaiting(waiting) {
    $("btn-login").hidden = waiting;
    $("login-wait").hidden = !waiting;
    if (waiting) {
      $("btn-gate-later").hidden = true;
      $("gate-snooze").hidden = true;
      $("manual-key").hidden = true;
      $("login-error").hidden = true;
      $("manual-key").open = false;
    } else {
      configureGate(); // restores the variant's own button/manual-key mix
    }
  }

  function buildStages(stages) {
    const list = $("stages");
    list.textContent = "";
    stageEls.clear();
    for (const s of stages || []) {
      if (s.needs_user_input) continue; // o instalador pula esses (não mostrar)
      const li = document.createElement("li");
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = MARKS.pending;
      const label = document.createElement("span");
      label.textContent = STAGE_NAMES[s.name] || s.title || s.name;
      li.append(mark, label);
      list.append(li);
      stageEls.set(s.name, li);
    }
    list.hidden = stageEls.size === 0;
  }

  function setStageState(name, state) {
    const li = stageEls.get(name);
    if (!li) return;
    li.className = state;
    const mark = li.querySelector(".mark");
    if (state === "running") {
      mark.textContent = "";
      li.scrollIntoView({ block: "nearest" });
    } else {
      mark.textContent = MARKS[state] || MARKS.pending;
    }
  }

  function appendLog(line) {
    if (!line) return;
    const pre = $("log");
    logCount += 1;
    if (logCount > 500) {
      const cut = pre.textContent.indexOf("\n");
      if (cut !== -1) pre.textContent = pre.textContent.slice(cut + 1);
    }
    pre.textContent += line + "\n";
    if ($("log-box").open) pre.scrollTop = pre.scrollHeight;
  }

  function apply(ev) {
    if (!ev || typeof ev !== "object") return;
    if (ev.type === "compact") {
      document.body.classList.toggle("compact", !!ev.on);
      return;
    }
    if (ev.type === "phase") {
      if (ev.gate) lastGate = ev.gate;
      setStatus(ev.phase, ev.message);
      return;
    }
    if (ev.type === "notice") {
      $("notice").textContent = ev.text || "";
      $("notice").hidden = !ev.text;
      return;
    }
    if (ev.type === "log") {
      appendLog(ev.line);
      return;
    }
    if (ev.type === "bootstrap" && ev.ev) {
      const b = ev.ev;
      if (b.type === "manifest") buildStages(b.stages);
      else if (b.type === "stage") setStageState(b.name, b.state);
      else if (b.type === "log") appendLog(b.line);
      return;
    }
  }

  // Replay do estado atual (cobre F5, janela recriada e eventos emitidos antes
  // de o listener subir), depois assina os eventos ao vivo.
  bridge.onEvent(apply);
  bridge
    .state()
    .then((s) => {
      if (!s) return;
      for (const ev of s.events || []) apply(ev);
      for (const line of s.logLines || []) appendLog(line);
      setStatus(s.phase, s.phase === "error" ? s.error : null);
    })
    .catch(() => {});

  // ── Entrar com Work4You (caminho primário do gate) ───────────────────────
  // login() resolve só no FIM do fluxo: chave gravada / sem crédito (o main
  // avança a fase nos dois casos), cancelado (janela fechada → volta pro
  // gate, sem erro) ou falha (mensagem no gate). A chave nunca chega aqui.
  const LOGIN_ERRORS = {
    "rate-limited": "Muitas tentativas agora. Espere um minuto e tente de novo.",
    network: "Não deu pra falar com o work4you.ai. Confira a internet e tente de novo.",
    "write-failed": "Entrou, mas não consegui gravar a chave. Tente de novo.",
    "invalid-response": "O login funcionou, mas a resposta veio estranha. Tente de novo — ou cole uma chave.",
  };
  let loginPending = false; // debounce: um fluxo por vez a partir desta página
  $("btn-login").addEventListener("click", async () => {
    if (loginPending) return;
    loginPending = true;
    setLoginWaiting(true);
    let r = null;
    try {
      r = await bridge.login();
    } catch {
      r = { ok: false, reason: "network" };
    } finally {
      loginPending = false;
    }
    if (r && r.ok) return; // o main avança a fase sozinho
    setLoginWaiting(false);
    const reason = (r && r.reason) || "";
    if (reason === "cancelled" || reason === "busy" || reason === "not-waiting") return;
    const msg = LOGIN_ERRORS[reason];
    $("login-error").textContent =
      msg || "Algo deu errado no login. Tente de novo — ou cole uma chave.";
    $("login-error").hidden = false;
  });
  $("btn-login-cancel").addEventListener("click", () => {
    void bridge.loginCancel(); // o login() pendente resolve "cancelled" e restaura o gate
  });

  // ── Chave manual (caminho secundário) ────────────────────────────────────
  $("key-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("key-input");
    const err = $("key-error");
    err.style.display = "none";
    $("key-save").disabled = true;
    try {
      const r = await bridge.submitKey(input.value);
      if (r && r.ok) {
        input.value = "";
        return; // o main avança a fase sozinho
      }
      err.textContent =
        r && r.error === "write-failed"
          ? "Não consegui gravar a chave. Tente de novo."
          : "Chave inválida — confira e tente de novo.";
      err.style.display = "block";
    } finally {
      $("key-save").disabled = false;
    }
  });
  $("key-skip").addEventListener("click", () => {
    void bridge.skipKey();
  });
  // "Agora não" (composio-only gate): boots without local connectors — the
  // gate returns on the next boot while the Composio key is still missing,
  // UNLESS "não perguntar de novo" is checked (persisted snooze; the tray's
  // "Entrar com Work4You" remains the way back). The model-key gate never
  // reaches this button, and the main double-checks anyway.
  $("btn-gate-later").addEventListener("click", () => {
    void bridge.skipKey({ snoozeComposio: $("gate-snooze-check").checked });
  });
  $("manual-key").addEventListener("toggle", () => {
    if ($("manual-key").open) $("key-input").focus();
  });

  // ── Erro: tentar de novo / cair pra nuvem ────────────────────────────────
  $("btn-retry").addEventListener("click", () => {
    void bridge.retry();
  });
  $("btn-cloud").addEventListener("click", () => {
    void bridge.useCloud();
  });
})();
</script>
</body>
</html>
