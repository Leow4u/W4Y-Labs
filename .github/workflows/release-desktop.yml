# One-click desktop release (Cloud Agent or human):
#   node scripts/release-desktop.mjs
# Pushes tag desktop/vX.Y.Z → builds web, publishes motor + casca, optional Fly.
#
# Manual fallback: Actions → Release Desktop → Run workflow.

name: Release Desktop

on:
  push:
    tags:
      - 'desktop/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop semver (must match package.json on the ref, e.g. 1.0.132)'
        required: true
      skip_fly:
        description: 'Skip Fly tenant overlay publish'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wayne-agent/package-lock.json

      - name: Install dependencies
        working-directory: wayne-agent
        run: npm ci

      - name: Build shared web bundle (app_dist)
        working-directory: wayne-agent/apps/work4you
        run: npm run build:web

      - name: Upload app_dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-dist
          path: wayne-agent/work4you_cli/app_dist
          if-no-files-found: error

  publish-windows:
    needs: build-web
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      desktop_version: ${{ steps.meta.outputs.desktop_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Download app_dist
        uses: actions/download-artifact@fa0a085b5821405c5620bc5e9fa10a4bd2deb4b6 # v4.1.8
        with:
          name: app-dist
          path: wayne-agent/work4you_cli/app_dist

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wayne-agent/package-lock.json

      - name: Install dependencies
        working-directory: wayne-agent
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Build engine runtime (win32-x64)
        working-directory: wayne-agent
        shell: bash
        run: |
          node scripts/build-engine-runtime.mjs \
            --out-dir apps/work4you/build/engine-runtime
          cat apps/work4you/build/engine-runtime/runtime-ready.json

      - name: Build NSIS installer (shell-only)
        working-directory: wayne-agent/apps/work4you
        env:
          W4Y_ENGINE_UPDATE_PUBLIC_KEY_B64: ${{ secrets.W4Y_ENGINE_UPDATE_PUBLIC_KEY_B64 }}
        run: npm run dist:win:nsis

      - name: Verify shell-only pack
        working-directory: wayne-agent/apps/work4you
        run: node scripts/verify-shell-only.mjs

      - name: Require the engine signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.W4Y_ENGINE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "Refusing to publish: secret W4Y_ENGINE_SIGNING_PRIVATE_KEY is missing." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.11
        with:
          credentials_json: ${{ secrets.GCP_W4Y_PUBLISH_SA_JSON }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Publish engine feed (win32-x64)
        working-directory: wayne-agent
        shell: bash
        env:
          W4Y_ENGINE_SIGNING_PRIVATE_KEY: ${{ secrets.W4Y_ENGINE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BUCKET=gs://w4y-engine-dist
          ENGINE_VERSION="$(date -u +%Y%m%d)-win32-x64"
          ARTIFACT="wayne-engine-${ENGINE_VERSION}.zip"
          ZIP="${RUNNER_TEMP}/${ARTIFACT}"

          PLATFORM=$(node -p "const m=require('./apps/work4you/build/engine-runtime/runtime-ready.json'); m.platform+'-'+m.arch")
          if [ "$PLATFORM" != "win32-x64" ]; then
            echo "Refusing to publish: runtime is $PLATFORM, expected win32-x64" >&2
            exit 1
          fi

          node scripts/build-engine-runtime.mjs --out-zip "$ZIP"
          gsutil -h 'Cache-Control:no-store' cp "$ZIP" "$BUCKET/$ARTIFACT"

          ENGINE_VERSION="$ENGINE_VERSION" ARTIFACT="$ARTIFACT" node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/latest-win32-x64.json", JSON.stringify({
              version: process.env.ENGINE_VERSION,
              zipUrl: "https://storage.googleapis.com/w4y-engine-dist/" + process.env.ARTIFACT,
              builtAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              runtimeReady: true,
              platform: "win32-x64",
            }));
          '
          node ../scripts/sign-engine-manifest.mjs \
            --zip "$ZIP" --manifest "${RUNNER_TEMP}/latest-win32-x64.json"
          node -e '
            const m = require(process.env.RUNNER_TEMP + "/latest-win32-x64.json");
            if (!m.sha256 || !m.signature) {
              console.error("Refusing to publish an unsigned engine manifest");
              process.exit(1);
            }
          '
          for NAME in latest-win32-x64.json latest.json; do
            gsutil -h 'Cache-Control:no-store' -h 'Content-Type:application/json; charset=utf-8' \
              cp "${RUNNER_TEMP}/latest-win32-x64.json" "$BUCKET/$NAME"
          done

      - name: Publish casca to GCS
        id: meta
        working-directory: wayne-agent/apps/work4you
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "desktop_version=$VERSION" >> "$GITHUB_OUTPUT"
          BUCKET=gs://w4y-engine-dist
          gsutil -h 'Cache-Control:no-store' cp "release/Work4You-${VERSION}-win-x64.exe" "$BUCKET/"
          gsutil -h 'Cache-Control:no-store' cp "release/Work4You-${VERSION}-win-x64.exe.blockmap" "$BUCKET/"
          gsutil -h 'Cache-Control:no-store' -h 'Content-Type:text/yaml; charset=utf-8' \
            cp release/latest.yml "$BUCKET/latest.yml"
          echo "Published Work4You ${VERSION} to ${BUCKET}"

      - name: Upload build artefacts (CI retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: work4you-win-x64
          path: |
            wayne-agent/apps/work4you/release/Work4You-*-win-x64.exe
            wayne-agent/apps/work4you/release/Work4You-*-win-x64.exe.blockmap
            wayne-agent/apps/work4you/release/latest.yml
          if-no-files-found: error

  publish-fly-tenant:
    needs: build-web
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_fly != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Download app_dist
        uses: actions/download-artifact@fa0a085b5821405c5620bc5e9fa10a4bd2deb4b6 # v4.1.8
        with:
          name: app-dist
          path: wayne-agent/work4you_cli/app_dist

      - name: Skip without Fly token
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: |
          echo "::warning::FLY_API_TOKEN not set — skipping Fly tenant overlay. Add the secret to automate brain publish."
          exit 0

      - name: Setup flyctl
        if: ${{ env.FLY_API_TOKEN != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Publish tenant UI overlay
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: bash platform/infra/publish-fly-tenant-ci.sh
