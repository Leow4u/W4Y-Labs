# W4Y internal lab / image-factory Fly app — NOT a customer runtime.
# Claude v1: customers get dedicated wayne-<slug>. This app stays for overlay
# publishes (publish-fly.ps1) and W4Y-only experiments. Shared motor is revoked.
app = "wayne-w4y"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.ui"
  [build.args]
    BASE_IMAGE = "registry.fly.io/wayne-w4y:fly258"

[processes]
  # init-fly -> main-wrapper.sh -> `wayne gateway run`
  app = "gateway run"

[env]
  WAYNE_DASHBOARD = "1"
  WAYNE_DASHBOARD_HOST = "0.0.0.0"
  WAYNE_DASHBOARD_PORT = "8080"
  FORWARDED_ALLOW_IPS = "*"
  # Revoked: do not run multi-tenant customer isolation on this app.
  W4Y_SHARED_MOTOR = "0"
  W4Y_PLATFORM_ORIGIN = "https://work4you.ai"
  # Legacy env on base images pointed at web_dist; UI overlay ships app_dist only.
  WAYNE_WEB_DIST = "/opt/wayne/wayne_cli/app_dist"

[mounts]
  source = "wayne_data"
  destination = "/opt/data"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
