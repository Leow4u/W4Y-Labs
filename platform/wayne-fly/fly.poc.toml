# PoC Wayne no Fly.io — GRU, autostop=suspend, volume persistente.
# Mesma topologia do Cloud Run: dashboard público na 8080, api_server
# interno na 8642 (config.yaml semeado pelo overlay da imagem).
app = "wayne-poc"
primary_region = "gru"

[build]
  image = "registry.fly.io/wayne-poc:poc2"

[processes]
  # main-wrapper.sh (CMD passthrough) -> `wayne gateway run`
  app = "gateway run"

[env]
  WAYNE_DASHBOARD = "1"
  WAYNE_DASHBOARD_HOST = "0.0.0.0"
  WAYNE_DASHBOARD_PORT = "8080"
  FORWARDED_ALLOW_IPS = "*"

[mounts]
  source = "wayne_data"
  destination = "/opt/data"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
