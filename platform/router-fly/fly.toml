# Roteador de sessão da Work4You — front door de app.work4you.ai (trilha E2).
# Sempre-aceso (é o front door; ~US$3/mês).
app = "router-w4y"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  # Published tag after `fly deploy --image-label r3` (or machine update).
  # image = "registry.fly.io/router-w4y:r3"

[env]
  # No DEFAULT_APP — missing/invalid w4y_route redirects to work4you.ai/login.
  # wayne-w4y is lab-only and must never be the customer fallback (Claude v1).
  PLATFORM_LOGIN_URL = "https://work4you.ai/login"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
