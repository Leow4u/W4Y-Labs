# Roteador de sessão da Work4You — porta de entrada de todas as instâncias
# Wayne atrás de work4you.ai. Sempre-aceso (é o front door; ~US$3/mês).
app = "router-w4y"
primary_region = "gru"

[build]
  image = "registry.fly.io/router-w4y:r1"

[env]
  DEFAULT_APP = "wayne-w4y"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
